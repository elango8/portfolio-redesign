<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Jenny Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <div class="login-card">
                <h1>Admin Login</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p class="error-message" id="loginError"></p>
                </form>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div class="dashboard-section" id="dashboardSection" style="display:none;">
            <header class="admin-header">
                <h1>Dashboard</h1>
                <button class="btn btn-outline" id="logoutBtn">Logout</button>
            </header>

            <nav class="admin-nav">
                <button class="tab-btn active" data-tab="projects">Projects</button>
                <button class="tab-btn" data-tab="certifications">Certifications</button>
            </nav>

            <!-- Projects Tab -->
            <div class="tab-content active" id="projects-tab">
                <div class="content-header">
                    <h2>Manage Projects</h2>
                    <button class="btn btn-primary" id="addProjectBtn">+ Add Project</button>
                </div>
                <div class="items-grid" id="projectsGrid"></div>
            </div>

            <!-- Certifications Tab -->
            <div class="tab-content" id="certifications-tab">
                <div class="content-header">
                    <h2>Manage Certifications</h2>
                    <button class="btn btn-primary" id="addCertBtn">+ Add Certification</button>
                </div>
                <div class="items-grid" id="certificationsGrid"></div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Add Item</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <form id="itemForm">
                    <input type="hidden" id="itemId" name="id">
                    <input type="hidden" id="itemType" name="type">

                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input type="text" id="image" name="image">
                    </div>

                    <div class="form-group project-field">
                        <label for="category">Category</label>
                        <input type="text" id="category" name="category">
                    </div>

                    <div class="form-group project-field">
                        <label for="link">Project Link</label>
                        <input type="text" id="link" name="link">
                    </div>

                    <div class="form-group cert-field" style="display:none;">
                        <label for="issuer">Issuer</label>
                        <input type="text" id="issuer" name="issuer">
                    </div>

                    <div class="form-group cert-field" style="display:none;">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="form-group cert-field" style="display:none;">
                        <label for="credentialId">Credential ID</label>
                        <input type="text" id="credentialId" name="credentialId">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Save</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>

</html>
